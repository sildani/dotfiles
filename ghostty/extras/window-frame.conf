# Ghostty's default window: title bar, frame, rounded corners and shadow, in
# place of the shared config's square, frameless one.
# To turn it on or off, add or remove its line in ~/.config/ghostty/local, reload
# with Cmd+Shift+, and open a new window: open windows keep their title bar style.
window-decoration = auto
macos-titlebar-style = transparent
macos-window-shadow = true

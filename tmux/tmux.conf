# Set true color
set -as terminal-features ',xterm*:RGB'

# Mouse support
set -g mouse on

# Set prefix
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Prefix, k: clear the screen and scrollback, like Cmd-k in Terminal.app.
# send-keys -R resets the pane (blanking the screen) before sending C-l so the
# shell redraws its prompt; clear-history then drops the scrollback, including
# the screen contents that scroll-on-clear just pushed into it.
bind-key k send-keys -R C-l \; clear-history

# set vi-mode
set-window-option -g mode-keys vi

# override copy mode to be vi-like
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Start windows and panes at 1 not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Pass modified keys (e.g. Shift-Enter) through to apps that request them,
# so Claude Code can tell Shift-Enter apart from Enter.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Let programs in tmux (nvim, shells over ssh) set the clipboard via OSC 52,
# which Ghostty accepts. Cost: any program in a pane can write the clipboard
# (by default, Ghostty still asks before reads). tmux-yank keeps working.
set -g set-clipboard on

# Let programs in the visible pane send escape sequences straight to Ghostty;
# `on`, not `all`, so hidden panes stay blocked. Cost: a program can mess up
# the terminal or write the clipboard.
set -g allow-passthrough on

# source and run tpm package
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.2' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
# Sessions survive kill-server and reboots: saved every 15 minutes, restored
# when the tmux server starts. See tmux/README.md.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# catppuccin settings
set -g @catppuccin_date_time_text " %d-%b-%Y %H:%M"

# Catppuccin status bar modules. #{E:...} expands when the bar is drawn, so
# these can come before TPM loads catppuccin, and must: continuum adds its
# auto-save hook to status-right when TPM loads it (test/lint.sh checks).
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}#{E:@catppuccin_status_date_time}"
# tmux truncates status-right at 40 chars by default, cutting off the date/time
set -g status-right-length 100

run '~/.tmux/plugins/tpm/tpm'

# Newer tmux underlines the current window tab by default; catppuccin doesn't override it
set -g window-status-current-style default

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Per-machine overrides (not in the repo). Silently skipped if missing.
source-file -q ~/.tmux.local.conf

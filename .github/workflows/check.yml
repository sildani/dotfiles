name: check

# Pushes to main, plus every PR: one run per change instead of one per event.
on:
  push:
    branches: [main]
  pull_request:

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - run: brew install shellcheck gitleaks
      - run: test/lint.sh
      - run: test/lint-selftest.sh

  fresh-home:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: test/fresh-home.sh

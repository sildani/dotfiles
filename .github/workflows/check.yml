name: check

# Pushes to main and every PR, one run per change instead of one per event, plus
# a weekly run of main: Oh My Zsh, the plugins and the runner image's Homebrew
# formulae move upstream, so a fresh install can break with no commit here.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history
      # Tests run on stock /bin/bash, as on a new Mac, not on a newer bash the
      # runner may have earlier on PATH. lib/test-guard.sh checks.
      - run: echo /bin >>"$GITHUB_PATH"
      - run: brew install shellcheck gitleaks
      - run: test/lint.sh
      # Nothing else runs on the runner, so the selftest takes all its cores.
      - run: echo "LINT_SELFTEST_JOBS=$(sysctl -n hw.ncpu)" >>"$GITHUB_ENV"
      - run: test/lint-selftest.sh
      - run: test/doctor-warnings.sh
      - run: test/updates.sh
      - run: test/ci-wait.sh
      - run: test/shrink.sh
      - run: test/tidy-names.sh
      # Skips: there is no installed nvim config in this job.
      - run: test/nvim.sh

  fresh-home:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Tests run on stock /bin/bash, as on a new Mac, not on a newer bash the
      # runner may have earlier on PATH. lib/test-guard.sh checks.
      - run: echo /bin >>"$GITHUB_PATH"
      - run: test/fresh-home.sh
